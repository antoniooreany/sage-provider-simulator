[project]
name = "sage-provider-simulator"
version = "0.1.0"
description = "A local Sage-like portfolio simulator for invoice provider integration testing."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
